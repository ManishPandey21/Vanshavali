[project]
name = "vanshavali-backend"
version = "0.1.0"
description = "Vanshavali — privacy-first Indian family heritage platform API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121",  # Depends(scope="function"): commit before the response (deps.py)
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "sqlalchemy>=2.0.32",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "python-multipart>=0.0.9",
  "redis>=5.0",
  "rq>=1.16",
  "boto3>=1.35",
  "pillow>=10.4",
  "pillow-heif>=0.18",
  "pypdf>=5.0",
  "pypdfium2>=4.30",
  "jellyfish>=1.1",
  "indic-transliteration>=2.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "moto[s3]>=5.0",
  "fakeredis>=2.24",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF012", "E501", "B904", "RUF001", "RUF002", "RUF003", "SIM102", "SIM103"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E731"]
"app/modules/genealogy/engine.py" = ["S608"]
"app/cli/benchmark.py" = ["S101", "C408", "RUF046"]  # developer benchmark CLI
"alembic/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx`"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
exclude = ["alembic/", "tests/"]
