# Static SPA + reverse proxy to the API. The HTML shell carries no family data (ADR-0001).
server {
  listen 8080;
  server_name _;
  server_tokens off; # no nginx version in the Server header or error pages (ZAP 10036)
  root /usr/share/nginx/html;
  client_max_body_size 55m;

  include /etc/nginx/snippets/vsh-security-headers.conf;

  # GEDCOM import packages (a .zip/.gdz with photos) may be up to VSH_MAX_GEDCOM_PACKAGE_BYTES
  # (250 MB); every other upload is capped at VSH_MAX_UPLOAD_BYTES (50 MB) by the 55m above. Without
  # this location nginx refused packages over 55 MB with 413 before the API saw them (pilot audit).
  location ~ ^/api/v1/trees/[^/]+/imports$ {
    client_max_body_size 260m;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /assets/ {
    include /etc/nginx/snippets/vsh-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
    include /etc/nginx/snippets/vsh-security-headers.conf;
    add_header Cache-Control "no-store";
  }
}
