# Security headers for every SPA response. nginx inherits add_header from the server level ONLY
# when a location defines no add_header of its own, so each location that sets add_header must
# include this file again (found by the DAST setup: / and /assets/ were served without them).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Robots-Tag "noindex, nofollow" always;
