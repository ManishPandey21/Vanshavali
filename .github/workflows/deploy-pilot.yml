# Deploy to staging or the pilot (ADR-0014; docs/operations/release-runbook.md).
#
# Manual only, from main only. Order:
#   gate    the full CI workflow on this exact commit (backend, frontend, e2e, security, docker,
#           migrations, deploy configuration)
#   images  build the backend and frontend images once, tagged with the commit SHA, and push to GHCR
#   deploy  needs approval of the GitHub environment (protected: Settings > Environments > required
#           reviewers), then runs deploy/pilot/scripts/deploy.sh <sha> on the VM over SSH
#           (backup, migrations, roll, readiness, smoke test, automatic app rollback on failure)
#
# Environment secrets (per environment): DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (a key whose
# authorized_keys entry forces deploy.sh), DEPLOY_KNOWN_HOSTS (the VM's host key line).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, pilot]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  images:
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      prefix: ${{ steps.prefix.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - id: prefix
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (tag = commit SHA)
        env:
          PREFIX: ${{ steps.prefix.outputs.prefix }}
        run: |
          for svc in backend frontend; do
            docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -t "$PREFIX/vanshavali-$svc:$GITHUB_SHA" "./$svc"
            docker push "$PREFIX/vanshavali-$svc:$GITHUB_SHA"
          done

  deploy:
    needs: images
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment }}
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH (forced command runs deploy.sh)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_SHA"
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
