# DAST: OWASP ZAP baseline (passive) against the SPA served by the production nginx image, and
# a ZAP API scan (active) driven by the OpenAPI document. Deliberately NOT on pull requests: a live
# scan is slow and more flaky than unit tests, so it runs weekly and on demand.
# See docs/security/threat-model.md (DAST) and docs/operations/deployment.md.
name: DAST

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC

permissions:
  contents: read

concurrency:
  group: dast
  cancel-in-progress: false

jobs:
  zap:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vanshavali
          POSTGRES_PASSWORD: vanshavali
          POSTGRES_DB: vsh_dast
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vanshavali" --health-interval 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      VSH_DATABASE_URL: postgresql+psycopg://vanshavali:vanshavali@localhost:5432/vsh_dast
      VSH_REDIS_URL: redis://localhost:6379/0
      VSH_RATE_LIMIT_BACKEND: redis
      VSH_JOB_MODE: sync
      VSH_OCR_ENABLED: "false"
      VSH_STORAGE_LOCAL_PATH: ${{ github.workspace }}/dast-storage
      VSH_PUBLIC_BASE_URL: http://localhost:8080
      VSH_CORS_ORIGINS: '["http://localhost:8080"]'
      # plain HTTP inside the runner; production enforces secure cookies + HSTS (see .zap/rules.tsv)
      VSH_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install backend
        working-directory: backend
        run: uv sync --frozen
      - name: Generate throwaway seed passwords (never committed; masked in logs)
        run: |
          for v in VSH_DEMO_PASSWORD VSH_SUPERADMIN_PASSWORD; do
            pw=$(openssl rand -base64 24)
            echo "::add-mask::$pw"
            echo "$v=$pw" >> "$GITHUB_ENV"
          done
      - name: Migrate and seed the demo tree
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run python -m app.cli.seed_demo
      - name: Create the non-owner app role (RLS applies to it, as in production)
        working-directory: backend
        env:
          VSH_APP_DB_ROLE: vanshavali_app
          VSH_APP_DB_PASSWORD: dast-app-password
        run: uv run python -m app.cli.ensure_app_role
      - name: Build and start the SPA with the production nginx image
        run: |
          docker build -t vanshavali-frontend ./frontend
          docker run -d --name spa --add-host backend:host-gateway -p 8080:8080 vanshavali-frontend
          for _ in $(seq 30); do curl -fsS -o /dev/null http://localhost:8080/ && break; sleep 1; done
          curl -fsSI http://localhost:8080/ | tee "$RUNNER_TEMP/spa-headers.txt"
          # The API must trust X-Forwarded-For from this container ONLY. Not its subnet: clients
          # reaching the published port appear to nginx as the bridge gateway, which must stay untrusted.
          echo "SPA_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' spa)" >> "$GITHUB_ENV"
      - name: Start API (uvicorn, 2 workers, all interfaces so the nginx container can reach it)
        working-directory: backend
        env:
          # the API runs as the app role; migrations and seeding above used the owner
          VSH_DATABASE_URL: postgresql+psycopg://vanshavali_app:dast-app-password@localhost:5432/vsh_dast
          # VSH_METRICS_TOKEN deliberately unset: /api/v1/metrics must answer 404 to the scanner
          # Same proxy-header handling as the production image: trust X-Forwarded-For only from the
          # nginx container's exact address, never "*" (backend/tests/test_proxy_headers.py).
          FORWARDED_ALLOW_IPS: ${{ env.SPA_IP }}
        run: |
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --no-access-log > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 60); do curl -fsS http://localhost:8000/api/v1/health && break; sleep 1; done
          curl -fsS http://localhost:8000/api/v1/health/ready
          curl -fsS http://localhost:8080/api/v1/health
      - name: A client cannot choose its own IP via X-Forwarded-For
        # Per-IP rate limits, the audit log and the session list use the derived client IP.
        run: |
          jar="$RUNNER_TEMP/spoof.txt"
          curl -fsS -c "$jar" -H 'Content-Type: application/json' -H 'X-Forwarded-For: 203.0.113.66' \
            -d "$(jq -n --arg pw "$VSH_DEMO_PASSWORD" '{email: "demo@example.com", password: $pw}')" \
            http://localhost:8080/api/v1/auth/login > /dev/null
          ips=$(curl -fsS -b "$jar" http://localhost:8080/api/v1/auth/sessions | python3 -c \
            'import json,sys; d=json.load(sys.stdin); print(" ".join(str(s.get("ip")) for s in d))')
          echo "session IPs: $ips"
          if grep -q 203.0.113.66 <<<"$ips"; then echo "::error::spoofed X-Forwarded-For was trusted"; exit 1; fi
      - name: Log in as the demo user (authenticated scan context)
        run: |
          jar="$RUNNER_TEMP/cookies.txt"
          curl -fsS -c "$jar" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg pw "$VSH_DEMO_PASSWORD" '{email: "demo@example.com", password: $pw}')" \
            http://localhost:8080/api/v1/auth/login > /dev/null
          session=$(awk '$6 == "vsh_session" {print $7}' "$jar")
          test -n "$session"
          echo "::add-mask::$session"
          # ZAP adds this header to every request to localhost. No X-CSRF-Token is sent, so unsafe
          # methods are rejected by the CSRF check: the active scan exercises authenticated reads
          # but cannot mutate the demo tree.
          {
            echo "ZAP_AUTH_HEADER=Cookie"
            echo "ZAP_AUTH_HEADER_VALUE=vsh_session=$session"
            echo "ZAP_AUTH_HEADER_SITE=localhost"
          } >> "$GITHUB_ENV"
      - name: Real IDs for the active API scan
        # Without them ZAP fills path parameters with placeholders ("tree_id") and nearly every
        # request stops at UUID validation, so the attacks never reach the data paths. ZAP's form
        # handler supplies these values for parameters of the same name.
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = "http://localhost:8080/api/v1"
          headers = {os.environ["ZAP_AUTH_HEADER"]: os.environ["ZAP_AUTH_HEADER_VALUE"]}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base + path, headers=headers)) as r:
                  d = json.load(r)
              return d.get("items", d) if isinstance(d, dict) else d
          t = get("/trees")[0]["id"]
          ids = {"tree_id": t}
          for key, path in [("person_id", "/people?limit=5"), ("place_id", "/places"), ("branch_id", "/branches"),
                            ("household_id", "/households"), ("source_id", "/sources"), ("document_id", "/documents"),
                            ("property_id", "/properties")]:
              items = get(f"/trees/{t}{path}")
              if isinstance(items, list) and items:
                  ids[key] = items[0]["id"]
          lines = []
          for i, (k, v) in enumerate(ids.items()):
              lines += [f"formhandler.fields.field({i}).fieldId={k}", f"formhandler.fields.field({i}).value={v}",
                        f"formhandler.fields.field({i}).enabled=true"]
          open("dast-ids.prop", "w").write("\n".join(lines) + "\n")
          print("ids:", ", ".join(ids))
          PY
      - name: ZAP baseline (SPA, passive)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8080/
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a -j -I"
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline
      - name: ZAP API scan (OpenAPI, active)
        if: success() || failure()
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: http://localhost:8080/api/v1/openapi.json
          format: openapi
          rules_file_name: .zap/rules.tsv
          # the workspace is mounted at /zap/wrk, so the IDs file written above is visible to ZAP
          cmd_options: '-a -I -z "-configfile /zap/wrk/dast-ids.prop"'
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-api-scan
      - name: Server logs
        if: always()
        run: |
          tail -n 200 "$RUNNER_TEMP/api.log" || true
          docker logs spa 2>&1 | tail -n 100 || true
