# DAST: OWASP ZAP baseline (passive) against the SPA served by the production nginx image, and
# a ZAP API scan (active) driven by the OpenAPI document. Deliberately NOT on pull requests: a live
# scan is slow and more flaky than unit tests, so it runs weekly and on demand.
# See docs/security/threat-model.md (DAST) and docs/operations/deployment.md.
name: DAST

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC

permissions:
  contents: read

concurrency:
  group: dast
  cancel-in-progress: false

jobs:
  zap:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vanshavali
          POSTGRES_PASSWORD: vanshavali
          POSTGRES_DB: vsh_dast
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vanshavali" --health-interval 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      VSH_DATABASE_URL: postgresql+psycopg://vanshavali:vanshavali@localhost:5432/vsh_dast
      VSH_REDIS_URL: redis://localhost:6379/0
      VSH_RATE_LIMIT_BACKEND: redis
      VSH_JOB_MODE: sync
      VSH_OCR_ENABLED: "false"
      VSH_STORAGE_LOCAL_PATH: ${{ github.workspace }}/dast-storage
      VSH_PUBLIC_BASE_URL: http://localhost:8080
      VSH_CORS_ORIGINS: '["http://localhost:8080"]'
      # plain HTTP inside the runner; production enforces secure cookies + HSTS (see .zap/rules.tsv)
      VSH_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install backend
        working-directory: backend
        run: uv sync --frozen
      - name: Migrate and seed the demo tree
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run python -m app.cli.seed_demo
      - name: Create the non-owner app role (RLS applies to it, as in production)
        working-directory: backend
        env:
          VSH_APP_DB_ROLE: vanshavali_app
          VSH_APP_DB_PASSWORD: dast-app-password
        run: uv run python -m app.cli.ensure_app_role
      - name: Start API (uvicorn, 2 workers, all interfaces so the nginx container can reach it)
        working-directory: backend
        env:
          # the API runs as the app role; migrations and seeding above used the owner
          VSH_DATABASE_URL: postgresql+psycopg://vanshavali_app:dast-app-password@localhost:5432/vsh_dast
          # VSH_METRICS_TOKEN deliberately unset: /api/v1/metrics must answer 404 to the scanner
        run: |
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 60); do curl -fsS http://localhost:8000/api/v1/health && break; sleep 1; done
          curl -fsS http://localhost:8000/api/v1/health/ready
      - name: Build and start the SPA with the production nginx image
        run: |
          docker build -t vanshavali-frontend ./frontend
          docker run -d --name spa --add-host backend:host-gateway -p 8080:8080 vanshavali-frontend
          for _ in $(seq 30); do curl -fsS -o /dev/null http://localhost:8080/ && break; sleep 1; done
          curl -fsSI http://localhost:8080/ | tee "$RUNNER_TEMP/spa-headers.txt"
          curl -fsS http://localhost:8080/api/v1/health
      - name: Log in as the demo user (authenticated scan context)
        run: |
          jar="$RUNNER_TEMP/cookies.txt"
          curl -fsS -c "$jar" -H 'Content-Type: application/json' \
            -d '{"email":"demo@example.com","password":"demo-password-123"}' \
            http://localhost:8080/api/v1/auth/login > /dev/null
          session=$(awk '$6 == "vsh_session" {print $7}' "$jar")
          test -n "$session"
          echo "::add-mask::$session"
          # ZAP adds this header to every request to localhost. No X-CSRF-Token is sent, so unsafe
          # methods are rejected by the CSRF check: the active scan exercises authenticated reads
          # but cannot mutate the demo tree.
          {
            echo "ZAP_AUTH_HEADER=Cookie"
            echo "ZAP_AUTH_HEADER_VALUE=vsh_session=$session"
            echo "ZAP_AUTH_HEADER_SITE=localhost"
          } >> "$GITHUB_ENV"
      - name: ZAP baseline (SPA, passive)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8080/
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a -j -I"
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline
      - name: ZAP API scan (OpenAPI, active)
        if: success() || failure()
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: http://localhost:8080/api/v1/openapi.json
          format: openapi
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a -I"
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-api-scan
      - name: Server logs
        if: always()
        run: |
          tail -n 200 "$RUNNER_TEMP/api.log" || true
          docker logs spa 2>&1 | tail -n 100 || true
