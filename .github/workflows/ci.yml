name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vanshavali
          POSTGRES_PASSWORD: vanshavali
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vanshavali" --health-interval 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: System packages (OCR)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-hin
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check app tests && uv run ruff format --check app tests
      - name: Type check
        run: uv run mypy app
      - name: Tests (unit, integration, authz, privacy, migrations)
        env:
          VSH_TEST_ADMIN_URL: postgresql+psycopg://vanshavali:vanshavali@localhost:5432/postgres
        run: uv run pytest -q --cov=app --cov-report=term-missing:skip-covered
      - name: Seed demo data on a migrated database
        env:
          PGPASSWORD: vanshavali
          VSH_DATABASE_URL: postgresql+psycopg://vanshavali:vanshavali@localhost:5432/vsh_seed
        run: |
          psql -h localhost -U vanshavali -d postgres -c "CREATE DATABASE vsh_seed"
          uv run alembic upgrade head
          uv run python -m app.cli.seed_demo

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vanshavali
          POSTGRES_PASSWORD: vanshavali
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vanshavali" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-hin
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd backend && uv sync --frozen
      - run: cd frontend && npm ci
      - run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - name: Playwright
        env:
          VSH_E2E_ADMIN_URL: postgresql+psycopg://vanshavali:vanshavali@localhost:5432/postgres
        run: cd e2e && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Python dependency audit
        run: cd backend && uv export --frozen --no-dev --format requirements-txt > /tmp/req.txt && uvx pip-audit -r /tmp/req.txt --disable-pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (production deps)
        run: cd frontend && npm ci && npm audit --omit=dev --audit-level=high
      - name: SAST (ruff security rules)
        run: cd backend && uvx ruff check --select S app

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker build -t vanshavali-backend ./backend
      - run: docker build -t vanshavali-frontend ./frontend
