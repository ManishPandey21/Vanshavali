name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the deploy gate (deploy-pilot.yml) runs this whole workflow first

permissions:
  contents: read

concurrency:
  # event in the key: a deploy's gate run on main must not cancel (or be cancelled by) the push run
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vanshavali
          POSTGRES_PASSWORD: vanshavali
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vanshavali" --health-interval 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: System packages (OCR)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-hin
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen
      - name: Calendar ephemeris cache (ADR-0022; the pinned file is checksum-verified on fetch)
        uses: actions/cache@v4
        with:
          path: backend/var/ephemeris
          key: ephemeris-de440s-c1c7feeab882263f
      - name: Calendar ephemeris (JPL DE440s)
        run: uv run python -m app.cli.calendar fetch-ephemeris
      - name: Lint
        run: uv run ruff check app tests && uv run ruff format --check app tests
      - name: Type check
        run: uv run mypy app
      - name: Tests (unit, integration, authz, privacy, migrations)
        env:
          VSH_TEST_ADMIN_URL: postgresql+psycopg://vanshavali:vanshavali@localhost:5432/postgres
          # the calendar engine tests must run here, never skip
          VSH_REQUIRE_EPHEMERIS: "1"
        run: uv run pytest -q --cov=app --cov-report=term-missing:skip-covered
      - name: Migrations from a clean database (upgrade, model drift check, downgrade, upgrade)
        env:
          PGPASSWORD: vanshavali
          VSH_DATABASE_URL: postgresql+psycopg://vanshavali:vanshavali@localhost:5432/vsh_migrations
        run: |
          psql -h localhost -U vanshavali -d postgres -c "CREATE DATABASE vsh_migrations"
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Load master data and seed demo data on a migrated database
        env:
          PGPASSWORD: vanshavali
          VSH_DATABASE_URL: postgresql+psycopg://vanshavali:vanshavali@localhost:5432/vsh_seed
        run: |
          psql -h localhost -U vanshavali -d postgres -c "CREATE DATABASE vsh_seed"
          uv run alembic upgrade head
          uv run python -m app.cli.masterdata load
          uv run python -m app.cli.masterdata load --dry-run
          export VSH_DEMO_PASSWORD="$(openssl rand -base64 24)" VSH_SUPERADMIN_PASSWORD="$(openssl rand -base64 24)"
          uv run python -m app.cli.seed_demo
          uv run python -m app.cli.seed_demo  # idempotent: a second run changes nothing

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Remotion animated exports (ADR-0017): typecheck, bundle and a REAL render of every composition
  # (posters) plus two MP4s, then the backend's end-to-end render test against that bundle.
  renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # a hung render must fail, not hold a runner for six hours
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vanshavali
          POSTGRES_PASSWORD: vanshavali
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vanshavali" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: cd renderer && npm ci && npm run typecheck && npm test
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: cd backend && uv sync --frozen
      - name: Real render through the API (render worker path)
        env:
          VSH_TEST_ADMIN_URL: postgresql+psycopg://vanshavali:vanshavali@localhost:5432/postgres
          VSH_TEST_REMOTION: "1"
        run: cd backend && uv run pytest -q tests/test_render_jobs.py

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vanshavali
          POSTGRES_PASSWORD: vanshavali
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vanshavali" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-hin
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd backend && uv sync --frozen
      - run: cd frontend && npm ci
      - run: cd e2e && npm ci && npx playwright install --with-deps chromium
      # Runs every spec, including tests/a11y.spec.ts: axe WCAG 2.2 A/AA scans (fail on serious or
      # critical), keyboard-only and screen-reader-semantics checks. See docs/accessibility/.
      - name: Playwright (end-to-end + accessibility)
        env:
          VSH_E2E_ADMIN_URL: postgresql+psycopg://vanshavali:vanshavali@localhost:5432/postgres
        run: cd e2e && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Python dependency audit
        run: cd backend && uv export --frozen --no-dev --format requirements-txt > /tmp/req.txt && uvx pip-audit -r /tmp/req.txt --disable-pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (production deps)
        run: cd frontend && npm ci && npm audit --omit=dev --audit-level=high
      - name: SAST (ruff security rules)
        run: cd backend && uvx ruff check --select S app

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker build -t vanshavali-backend ./backend
      - run: docker build -t vanshavali-frontend ./frontend

  # Pilot deployment configuration (deploy/pilot): the files deploy.sh runs must be valid.
  deploy-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compose file renders with the example settings
        run: |
          mkdir -p /tmp/vsh-conf && for f in deploy/pilot/env/*.env.example; do
            cp "$f" "/tmp/vsh-conf/$(basename "$f" .example)"; done
          VSH_CONFIG_DIR=/tmp/vsh-conf VSH_VERSION=ci docker compose \
            --env-file /tmp/vsh-conf/compose.env -f deploy/pilot/compose.yml --profile release --profile tools \
            --profile monitoring config -q
      - name: Caddyfile is valid
        run: |
          docker run --rm -e VSH_DOMAIN=pilot.example.org -e VSH_TLS=ops@example.org \
            -v "$PWD/deploy/pilot/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Alert rules load and their unit tests pass
        run: |
          docker run --rm -v "$PWD/deploy/pilot/monitoring:/m:ro" -w /m --entrypoint promtool \
            prom/prometheus:v3.5.0 check rules alerts.yml
          docker run --rm -v "$PWD/deploy/pilot/monitoring:/m:ro" -w /m --entrypoint promtool \
            prom/prometheus:v3.5.0 test rules alerts.test.yml
      - name: Shell scripts (shellcheck)
        run: shellcheck -x -P SCRIPTDIR deploy/pilot/scripts/*.sh deploy/pilot/drill/run-drill.sh ops/backup/drill.sh ops/loadtest/*.sh
